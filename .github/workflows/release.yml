name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build and verify release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./build_release.sh "$VERSION"
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag --draft --title "BitConfig $VERSION" --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -mod=readonly ./...
      - run: go run . help

  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify reproducible release archives
        run: |
          ./build_release.sh v0.0.0-ci
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/first-build.sha256"
          sleep 2
          ./build_release.sh v0.0.0-ci
          diff "$RUNNER_TEMP/first-build.sha256" dist/SHA256SUMS.txt
          cd dist
          sha256sum -c SHA256SUMS.txt
          tar -xzf bitconfig-v0.0.0-ci-linux-amd64.tar.gz
          ./bitconfig-v0.0.0-ci-linux-amd64/bitconfig help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
